name: Deploy Docs to GitHub Pages

# 把 docs/ 下的设计笔记用 VitePress 构建并发布到 GitHub Pages。
# 独立于 ci.yml，互不干涉。
# 一次性前置：仓库 Settings → Pages → Source 选 "GitHub Actions"。

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# GitHub Pages 官方模板必备：避免并发部署互相抢占。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # package.json engines 要求 node >=22（Pyodide code runner 在 node 20 上不可用），钉死不依赖 runner 默认
          cache: npm
      - run: npm ci
      - name: Build VitePress site
        run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
